[project]
name = "swing"
version = "0.1.0"
description = "Beslutsstöd för swing trading i amerikanska aktier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
swing = "swing.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
